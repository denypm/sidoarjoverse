<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel Admin — SidoarjoVerse</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<header class="top">
  <div class="brand"><span class="logo">Sidoarjo<b>Verse</b></span><span class="day">ADMIN</span></div>
  <div class="hd-act"><a href="index.html" target="_blank" class="btn ghost kecil">Buka peta ↗</a><button id="keluar" class="btn ghost kecil" hidden>Keluar</button></div>
</header>

<main class="adm">
  <section id="login" class="kotak">
    <h2>Masuk Admin</h2>
    <p class="sub" id="loginInfo"></p>
    <div class="fld" id="fldEmail"><label for="lEmail">Email</label><input id="lEmail" class="inp" type="email" autocomplete="username"></div>
    <div class="fld"><label for="lPass">Password</label><input id="lPass" class="inp" type="password" autocomplete="current-password"></div>
    <div class="err" id="lErr"></div>
    <button class="btn oren full" id="lMasuk">Masuk</button>
  </section>

  <section id="panel" hidden>
    <nav class="atabs">
      <button data-s="umum" class="on">Umum</button>
      <button data-s="bangunan">Bangunan</button>
      <button data-s="info">Info</button>
      <button data-s="donasi">Donasi</button>
      <button data-s="maskot">Maskot</button>
      <button data-s="warga">Warga</button>
      <button data-s="data">Data</button>
    </nav>
    <div id="isi"></div>
  </section>
</main>

<div class="simpanbar" id="simpanbar" hidden>
  <span id="status">Ada perubahan yang belum disimpan.</span>
  <button class="btn oren" id="simpan">💾 Simpan &amp; Publikasikan</button>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
